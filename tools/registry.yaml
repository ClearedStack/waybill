# Sub-tools of waybill. Each has a matching rule, the logic and fixtures.
# A test (tools/spec-profiles/profiles_test.go) checks this file against the
# profiles compiled into the binary and against the folders on disk.
sub_tools:
  - name: spec-profiles
    path: tools/spec-profiles
    profiles:
      - tool_type: calculator
        path: tools/spec-profiles/calculator
        match: tools/spec-profiles/calculator/match.go
        logic: tools/spec-profiles/calculator/build.go
        fixtures: tools/spec-profiles/calculator/testdata
      - tool_type: checklist
        path: tools/spec-profiles/checklist
        match: tools/spec-profiles/checklist/match.go
        logic: tools/spec-profiles/checklist/build.go
        fixtures: tools/spec-profiles/checklist/testdata
      - tool_type: validator
        path: tools/spec-profiles/validator
        match: tools/spec-profiles/validator/match.go
        logic: tools/spec-profiles/validator/build.go
        fixtures: tools/spec-profiles/validator/testdata
      - tool_type: decision-tree
        path: tools/spec-profiles/decision-tree
        match: tools/spec-profiles/decision-tree/match.go
        logic: tools/spec-profiles/decision-tree/build.go
        fixtures: tools/spec-profiles/decision-tree/testdata
