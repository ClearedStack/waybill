# Default deny for all pods in cs-workers, plus the narrow egress rule for
# Waybill: cluster DNS and HTTP to Muster in namespace clearedstack.
# Waybill accepts no ingress and has no egress to Logbook, Plainforge,
# Lazarette, or the public internet.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: cs-workers
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: waybill-egress
  namespace: cs-workers
  labels:
    app.kubernetes.io/name: waybill
    app.kubernetes.io/part-of: clearedstack
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: waybill
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: clearedstack
          podSelector:
            matchLabels:
              app.kubernetes.io/name: muster
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
